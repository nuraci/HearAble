# /etc/network/interfaces.d/hearable — il link privato verso il decoder.
#
# Statico di proposito: niente DHCP sul percorso critico, niente gateway e
# niente DNS, così questa interfaccia non può diventare la default route.
# Il Wake-on-LAN è abilitato qui perché il driver r8169 lo riazzera a ogni boot.
auto enp1s0
iface enp1s0 inet static
	address 10.77.0.2
	netmask 255.255.255.0
	up /usr/sbin/ethtool -s $IFACE wol g || true
