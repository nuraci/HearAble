# The receiver's end of the private link — goes inside /etc/network/interfaces.
#
# Enigma2 writes that file itself and puts "Do NOT change manually!" at the top.
# This stanza has to be merged into it by hand anyway: Enigma2's own network
# configuration screen cannot express an interface with an address and no
# gateway, which is exactly what is wanted here.
#
# Static on purpose: no DHCP on the critical path, no gateway and no DNS, so
# this interface can never become the default route. The way to the house and to
# the internet is the receiver's Wi-Fi; this cable goes to the mini PC and
# nowhere else.
#
# Keep `auto wlan0` and its wpa_supplicant line as Enigma2 generated them. The
# two interfaces coexist and the default route stays on Wi-Fi.

auto eth0
iface eth0 inet static
	address 10.77.0.1
	netmask 255.255.255.0
	# ifup sets the address but does not always bring the link up on this
	# image: observed after an ifdown/ifup, with the address present and the
	# interface DOWN. One line, and it stops being a mystery at the next boot.
	up ip link set $IFACE up
